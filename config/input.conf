# Bailey Player — keys and the main menu.
# Lines ending in `#! ...` also build the uosc main menu (the ☰ button).
# A `#` in place of a key means "menu item only, no key".
# In VR mode, mpv360 takes over: arrows look around, wheel zooms, click looks
# around, R resets the view, E switches eye (see script-opts/mpv360.conf).

o           script-message-to bailey open-file          #! Open file…
O           script-message-to bailey open-folder        #! Open folder…
ctrl+v      script-message-to bailey open-link          #! Open a link…
#           script-message-to bailey recent             #! Recent
MBTN_RIGHT  script-message-to bailey quick-settings     #! Quick settings
v           script-message-to bailey vr-toggle          #! VR > VR mode on / off
#           script-message-to mpv360 reset-view         #! VR > Reset view
#           script-message-to mpv360 toggle-mouse-look  #! VR > Look around with the mouse
z           script-message-to bailey zoom-pan           #! Picture > Zoom & pan (flat videos)
#           script-message-to bailey toggle-super-res   #! Picture > Super Resolution on / off
#           script-message-to bailey toggle-hdr         #! Picture > HDR on / off
#           script-message-to bailey toggle-smooth      #! Picture > Smooth motion on / off
#           script-binding uosc/subtitles               #! Subtitles
#           script-binding uosc/audio                   #! Audio track
s           screenshot                                  #! Screenshot (saved to the Desktop)
?           script-binding uosc/keybinds                #! Keyboard shortcuts

# Skip back / forward. J and L (YouTube's keys) work in every mode; the arrow
# keys skip only on normal videos (in VR mode they look around).
j           seek -10; script-binding uosc/flash-timeline    #! Skip > Back 10 s  (J or ←)
l           seek 10; script-binding uosc/flash-timeline     #! Skip > Forward 10 s  (L or →)
J           seek -30; script-binding uosc/flash-timeline    #! Skip > Back 30 s  (Shift+J or Shift+←)
L           seek 30; script-binding uosc/flash-timeline     #! Skip > Forward 30 s  (Shift+L or Shift+→)
LEFT        seek -10; script-binding uosc/flash-timeline
RIGHT       seek 10; script-binding uosc/flash-timeline
Shift+LEFT  seek -30; script-binding uosc/flash-timeline
Shift+RIGHT seek 30; script-binding uosc/flash-timeline

# Click the picture to pause (in VR mode a click looks around instead).
MBTN_LEFT       cycle pause
MBTN_LEFT_DBL   cycle fullscreen
SPACE           cycle pause
ESC             set fullscreen no
