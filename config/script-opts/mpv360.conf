# mpv360 (the VR viewer) — Bailey Player settings.
# These keys only work while VR mode is on. With VR off, the arrow keys
# and mouse wheel go back to their normal jobs (seek and volume).

show_values=no
invert_mouse=no
mouse_sensitivity=0.0035
step=0.02

# Starting view: straight ahead, 120° wide
yaw=0.0
pitch=0.0
fov=2.1

# Default format: dual half-equirectangular (the usual VR180 side-by-side)
input_projection=2
eye=0
sampling=1

## Keybindings (VR mode only)
toggle=v
look-up=UP
look-down=DOWN
look-left=LEFT
look-right=RIGHT
fov-increase=WHEEL_DOWN
fov-decrease=WHEEL_UP
toggle-mouse-look=MBTN_LEFT
reset-view=r
switch-eye=e
cycle-projection=p
fisheye-fov-increase=Ctrl+f
fisheye-fov-decrease=Ctrl+Shift+f
roll-left=
roll-right=
cycle-sampling=
show-help=
