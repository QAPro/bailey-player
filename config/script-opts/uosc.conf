# uosc (the on-screen controls) — Bailey Player theme: "Forest Night".
# Only the settings we change are listed; everything else keeps uosc's default.

# Colours: forest green UI on a deep green-black. (Purple is reserved for VR,
# drawn by bailey.lua, because uosc has a single highlight colour.)
color=foreground=6CC08F,foreground_text=0B140F,background=0F1A14,background_text=E6EFE8,window_border=0E1612,curtain=0E1612,success=6CC08F,error=FF616E,match=B39BF7
opacity=timeline=0.9,controls=0,menu=0.97,submenu=0.5,title=0.85,tooltip=0.95,curtain=0.75

border_radius=6
font_scale=1
text_border=1.2

# Timeline: thin line that grows when the mouse comes near
timeline_style=line
timeline_line_width=3
timeline_size=40
progress=windowed
progress_size=3
progress_line_width=20

# Control bar, left to right:
# menu · open · VR · subtitles · audio ·· prev · play/pause · next ·· speed · quick settings · fullscreen
controls=menu,gap,command:folder_open:script-message-to bailey open-file?Open file,button:bailey-vr,<has_sub>subtitles,<has_many_audio>audio,space,prev,play-pause,next,space,<video,audio>speed:1,gap,command:tune:script-message-to bailey quick-settings?Quick settings (right-click),fullscreen
controls_size=32
controls_margin=8

volume=right
volume_size=40

top_bar=no-border
top_bar_size=40
top_bar_controls=right
top_bar_title=yes

menu_item_height=36
menu_min_width=300

# Thumbnails on the seek bar come from thumbfast
pause_indicator=flash

# Show the controls whenever the mouse moves anywhere over the video (not only
# near the bottom edge), hide them after 1.5 s of stillness (cursor-autohide in
# mpv.conf), and keep them up while paused or playing audio.
proximity_in=5000
proximity_out=5001
autohide=yes
timeline_persistency=paused,audio
controls_persistency=paused,audio
volume_persistency=paused,audio
top_bar_persistency=paused,audio
