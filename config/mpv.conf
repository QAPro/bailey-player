# Bailey Player — mpv settings.
# This folder is Bailey Player's own config folder (mpv runs with --config-dir pointing here),
# so plain mpv on the same PC is not affected.

# ---- Window ----
title=${?media-title:${media-title}}${!media-title:Bailey Player}
title-bar=no                # uosc draws its own top bar and window buttons
idle=yes                    # open to the start screen when no file is given
force-window=yes
keep-open=yes               # stay on the last frame instead of closing at the end
autofit-larger=85%x85%
background=color
background-color=#0E1612

# ---- On-screen UI (uosc) ----
osc=no                      # uosc replaces the stock controller
osd-bar=no
border=yes
osd-font=Inter
osd-font-size=30
cursor-autohide=1000

# ---- Picture ----
vo=gpu-next
gpu-api=d3d11
hwdec=auto-safe

# Smooth motion (frame interpolation). Toggle in Quick settings.
video-sync=display-resample
interpolation=yes
tscale=oversample

# ---- Resume where you left off ----
save-position-on-quit=yes
watch-later-dir=~~/watch_later
watch-later-options-remove=vf,glsl-shaders,glsl-shader-opts,video-zoom,video-pan-x,video-pan-y

# ---- Screenshots (S) go to the Desktop ----
screenshot-dir=~~desktop/
screenshot-format=png
